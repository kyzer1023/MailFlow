name: Deploy production candidate

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact commit SHA for the reviewed production candidate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mailflow-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrate and deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check out the verified candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - name: Confirm the verified candidate SHA
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build production static assets
        run: npm run build
      - name: Apply production migrations
        run: npx wrangler d1 migrations apply mailflow-db --remote
      - name: Deploy the production Worker
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: npx wrangler deploy --message "Production candidate $CANDIDATE_SHA"
