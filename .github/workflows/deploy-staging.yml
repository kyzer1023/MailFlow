name: Deploy staging candidate

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact commit SHA for the reviewed PR candidate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mailflow-staging
  cancel-in-progress: false

jobs:
  verify:
    name: Verify candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - name: Confirm the exact candidate SHA
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run repository checks
        run: npm test
      - name: Dry-run production packaging
        run: npx wrangler deploy --dry-run
      - name: Build staging static assets
        run: npm run build:staging
      - name: Freeze and validate staging configuration
        run: npm run prepare:staging-config
      - name: Dry-run staging packaging
        run: npx wrangler deploy --config dist/client/mailflow/wrangler.staging-validated.json --dry-run

  deploy:
    name: Migrate and deploy staging
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check out the verified candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - name: Confirm the verified candidate SHA
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build static assets
        run: npm run build:staging
      - name: Freeze and validate staging configuration
        run: npm run prepare:staging-config
      - name: Apply staging migrations
        run: npx wrangler d1 migrations apply mailflow-staging-db --remote --env staging
      - name: Deploy the staging Worker
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: npx wrangler deploy --config dist/client/mailflow/wrangler.staging-validated.json --message "Staging candidate $CANDIDATE_SHA"
